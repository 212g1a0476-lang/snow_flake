version: 2

sources:
  - name: datafeed_shared_schema
    database: di_sales
    schema: raw_schema

    tables:
      - name: raw_customerdata

      - name: orders
        columns:
          - name: id
            tests:
              - unique
              - not_null

          - name: status
            tests:
              - accepted_values:
                  arguments:
                    values: ['placed', 'shipped', 'completed', 'returned', 'return_pending']

      - name: customers